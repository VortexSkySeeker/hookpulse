[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookpulse"
version = "0.1.0"
description = "Interactive Terminal (TUI) Webhook & API Request Debugger with instant Replay, Pydantic v2 schema generation, and cURL export."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["webhook", "tui", "textual", "api", "debugger", "pydantic", "cli", "devtools", "stripe", "github"]
authors = [
    { name = "HookPulse Contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "textual>=0.80.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pyperclip>=1.8.2",
]

[project.scripts]
hookpulse = "hookpulse.cli:main"
